name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install 32-bit toolchain and libpq
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y g++-multilib cmake ninja-build libpq-dev:i386

      - name: Build and package
        run: ./package.sh

      - name: Test
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: |
          cmake -S . -B build -DOMP_POSTGRES_BUILD_TESTS=ON
          cmake --build build
          ctest --test-dir build --output-on-failure

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: dist/*.tar.gz

  windows:
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg-cache
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Restore vcpkg cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vcpkg-cache
          key: vcpkg-x86-windows-static-${{ hashFiles('vcpkg.json', '.github/workflows/build.yml') }}

      # vcpkg.json pins a baseline that may be newer than the runner image's vcpkg checkout.
      - name: Update vcpkg
        run: |
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          git -C "$env:VCPKG_INSTALLATION_ROOT" fetch --quiet origin

      # CMake installs libpq from vcpkg.json (manifest mode) while configuring.
      - name: Build
        run: |
          cmake -S . -B build -A Win32 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x86-windows-static
          cmake --build build --config Release --parallel

      - name: Package
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(omp-postgres .*VERSION ([0-9.]+)\)').Matches[0].Groups[1].Value
          $stage = "build\package"
          New-Item -ItemType Directory -Force "$stage\components", "$stage\qawno\include", dist | Out-Null
          Copy-Item build\Release\Postgres.dll "$stage\components\"
          Copy-Item include\omp_postgres.inc "$stage\qawno\include\"
          Copy-Item LICENSE, README.md $stage
          # libpq and its dependencies are linked in, so their licenses ship too.
          New-Item -ItemType Directory -Force "$stage\licenses" | Out-Null
          Get-ChildItem build\vcpkg_installed\x86-windows-static\share -Directory | ForEach-Object {
            $copyright = Join-Path $_.FullName copyright
            if (Test-Path $copyright) { Copy-Item $copyright "$stage\licenses\$($_.Name).txt" }
          }
          if (-not (Test-Path "$stage\licenses\libpq.txt")) { throw "libpq license not found" }
          Compress-Archive -Path "$stage\*" -DestinationPath "dist\omp-postgres-$version-windows.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
